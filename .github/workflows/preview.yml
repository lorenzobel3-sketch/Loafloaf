# Publishes the-sourdough-house as a browsable web page so it can be looked at
# on a phone or an iPad. A file opened from disk cannot do this: Safari refuses
# to let a local file pull in the film and the photographs, so the site has to
# be served over https to be seen at all.
#
# Two things about how this is wired, both deliberate:
#
#   * It lives on main because GitHub only allows the default branch to publish
#     to Pages. The run happens here, but the SITE is checked out from the
#     working branch below, which is where the site actually lives. Change
#     SITE_BRANCH when the site moves.
#
#   * The six media files are not in the repo. They are fetched at build time
#     from where they are already hosted, so the published page serves its own
#     copy and depends on nothing at runtime.

name: Publish the preview site

on:
  workflow_dispatch:

env:
  SITE_BRANCH: claude/10k-websites-skill-15ngpa

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SITE_BRANCH }}

      - name: Fetch the film and the photographs
        run: bash the-sourdough-house/fetch-assets.sh

      - name: Stage just the site itself
        run: |
          mkdir -p _site
          cp the-sourdough-house/index.html _site/index.html
          cp -r the-sourdough-house/assets _site/assets
          rm -f _site/assets/.gitkeep
          ls -la _site _site/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
